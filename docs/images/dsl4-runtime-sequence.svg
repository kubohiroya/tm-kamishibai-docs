<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">DSL 4.0 rc.5通常実行シーケンス</title><desc id="desc">runtime startupからasset準備、scene enter、action dispatch、port adapter完了、action commit、終了とasset解放までの通常実行と失敗分岐。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#315b72"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#ad4545"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#172b3a}.title{font-size:29px;font-weight:700}.sub{font-size:15px;fill:#486272}.actor{fill:#eaf4fa;stroke:#36799d;stroke-width:2;rx:10}.core{fill:#e8f7f1;stroke:#2d806d;stroke-width:2;rx:10}.platform{fill:#fff1df;stroke:#b9762a;stroke-width:2;rx:10}.label{font-size:16px;font-weight:700;text-anchor:middle}.code{font-family:"SFMono-Regular",Consolas,monospace;font-size:12px;text-anchor:middle;fill:#315b72}.life{stroke:#98aab5;stroke-width:1.5;stroke-dasharray:6 6}.msg{stroke:#315b72;stroke-width:2;fill:none;marker-end:url(#a)}.ret{stroke:#55798d;stroke-width:1.8;stroke-dasharray:6 5;fill:none;marker-end:url(#a)}.danger{stroke:#ad4545;marker-end:url(#r)}.txt{font-size:14px;fill:#304a59;text-anchor:middle}.dangerText{fill:#9c3535}.event{fill:#f4f0fb;stroke:#7758a1;stroke-width:1.6}.eventText{font-family:"SFMono-Regular",Consolas,monospace;font-size:12px;fill:#5a417d}.loop{fill:none;stroke:#78909e;stroke-width:1.6;stroke-dasharray:8 5}.loopLabel{font-size:13px;font-weight:700;fill:#4c6472}.alt{fill:#fff4f4;stroke:#b64c4c;stroke-width:1.7}.note{font-size:13px;fill:#536673}</style></defs>
  <rect width="1400" height="900" fill="#fff"/><text class="title" x="35" y="45">通常起動・scene・action実行</text><text class="sub" x="35" y="73">portが返すPromiseの完了後だけ`action.commit`へ進む。failure時は現在actionをabortし、assetをreleaseする。</text>
  <g><rect class="actor" x="30" y="95" width="170" height="58"/><text class="label" x="115" y="119">Runtime startup</text><text class="code" x="115" y="140">runtime-startup.js</text><rect class="core" x="240" y="95" width="170" height="58"/><text class="label" x="325" y="119">Navigation</text><text class="code" x="325" y="140">navigation-session.js</text><rect class="core" x="450" y="95" width="180" height="58"/><text class="label" x="540" y="119">Controller</text><text class="code" x="540" y="140">runtime-controller.js</text><rect class="platform" x="670" y="95" width="170" height="58"/><text class="label" x="755" y="119">Asset lifecycle</text><text class="code" x="755" y="140">preload coordinator</text><rect class="actor" x="880" y="95" width="150" height="58"/><text class="label" x="955" y="119">Port</text><text class="code" x="955" y="140">command contract</text><rect class="platform" x="1070" y="95" width="170" height="58"/><text class="label" x="1155" y="119">Adapter</text><text class="code" x="1155" y="140">TurboWarp / DOM</text><rect class="actor" x="1280" y="95" width="95" height="58"/><text class="label" x="1328" y="119">Observer</text><text class="code" x="1328" y="140">events</text></g>
  <g><path class="life" d="M115 153V860"/><path class="life" d="M325 153V860"/><path class="life" d="M540 153V860"/><path class="life" d="M755 153V860"/><path class="life" d="M955 153V860"/><path class="life" d="M1155 153V860"/><path class="life" d="M1328 153V860"/></g>
  <path class="msg" d="M115 190H317"/><text class="txt" x="216" y="181">validated component + environment</text><path class="msg" d="M325 235H532"/><text class="txt" x="429" y="226">start(entry scene, variables)</text>
  <rect class="event" x="1218" y="248" width="155" height="34" rx="8"/><text class="eventText" x="1295" y="269" text-anchor="middle">runtime.start</text><path class="msg" d="M540 265H1212"/>
  <path class="msg" d="M540 315H747"/><text class="txt" x="644" y="306">prepareStartup(generation)</text><path class="ret" d="M755 355H548"/><text class="txt" x="651" y="346">startup assets ready</text>
  <path class="msg" d="M540 400H747"/><text class="txt" x="644" y="391">beginScene + commitScene</text><path class="ret" d="M755 438H548"/><text class="txt" x="651" y="429">scene resources active</text>
  <rect class="event" x="1210" y="396" width="163" height="70" rx="9"/><text class="eventText" x="1292" y="420" text-anchor="middle">scene.transition</text><text class="eventText" x="1292" y="444" text-anchor="middle">scene.enter</text><path class="msg" d="M540 455H1204"/>
  <rect class="loop" x="425" y="490" width="860" height="245" rx="14"/><text class="loopLabel" x="442" y="514">loop: scene.actions</text>
  <rect class="event" x="1115" y="525" width="150" height="32" rx="8"/><text class="eventText" x="1190" y="546" text-anchor="middle">action.start</text><path class="msg" d="M540 541H1109"/>
  <path class="msg" d="M540 585H947"/><text class="txt" x="744" y="576">dispatch(command, ActionContext)</text><path class="msg" d="M955 625H1147"/><text class="txt" x="1051" y="616">adapter operation(signal)</text><path class="ret" d="M1155 665H963"/><text class="txt" x="1059" y="656">completion / transition</text><path class="ret" d="M955 700H548"/><text class="txt" x="752" y="691">resolved result</text>
  <rect class="event" x="1115" y="688" width="150" height="32" rx="8"/><text class="eventText" x="1190" y="709" text-anchor="middle">action.commit</text><path class="msg" d="M540 714H1109"/>
  <path class="msg" d="M540 765H747"/><text class="txt" x="644" y="756">next scene prepare / commit</text><path class="ret" d="M755 800H548"/><text class="txt" x="651" y="791">ready, or no next scene</text>
  <rect class="event" x="1198" y="775" width="175" height="34" rx="8"/><text class="eventText" x="1286" y="797" text-anchor="middle">runtime.finish</text><path class="msg" d="M540 820H1192"/><path class="msg" d="M540 850H747"/><text class="txt" x="644" y="842">release(runtime-finished)</text>
  <rect class="alt" x="35" y="675" width="350" height="155" rx="12"/><text class="label dangerText" x="210" y="703">alt: action / port / asset failure</text><text class="note" x="55" y="730">1. AbortControllerで現在actionを取消</text><text class="note" x="55" y="755">2. generationを無効化しcleanup</text><text class="note" x="55" y="780">3. canonical diagnosticをsnapshotへ格納</text><text class="note" x="55" y="805">4. runtime.failを発行しassetをrelease</text>
</svg>
