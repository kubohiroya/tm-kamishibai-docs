<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">DSL 4.0 rc.5 source live reloadシーケンス</title><desc id="desc">source変更を検証し、current runtimeをquiesceしてreload planを作り、deferまたは次sessionへcommitする流れとinvalid・failure分岐。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#315b72"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#ad4545"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#172b3a}.title{font-size:29px;font-weight:700}.sub{font-size:15px;fill:#486272}.actor{fill:#eaf4fa;stroke:#397a9c;stroke-width:2;rx:10}.core{fill:#e8f7f1;stroke:#2f806e;stroke-width:2;rx:10}.ui{fill:#f1eafa;stroke:#7354a3;stroke-width:2;rx:10}.label{font-size:15px;font-weight:700;text-anchor:middle}.code{font-family:"SFMono-Regular",Consolas,monospace;font-size:11px;text-anchor:middle;fill:#315b72}.life{stroke:#98aab5;stroke-width:1.5;stroke-dasharray:6 6}.msg{stroke:#315b72;stroke-width:2;fill:none;marker-end:url(#a)}.ret{stroke:#55798d;stroke-width:1.8;stroke-dasharray:6 5;fill:none;marker-end:url(#a)}.danger{stroke:#ad4545;marker-end:url(#r)}.txt{font-size:13px;fill:#304a59;text-anchor:middle}.dangerText{fill:#9c3535}.invalid{fill:#fff4f4;stroke:#b64d4d;stroke-width:1.7}.choice{fill:#f6f1fb;stroke:#7960a2;stroke-width:1.7}.note{font-size:12.5px;fill:#526672}.state{font-family:"SFMono-Regular",Consolas,monospace;font-size:12px;font-weight:700;fill:#5b427b}</style></defs>
  <rect width="1400" height="900" fill="#fff"/><text class="title" x="30" y="44">Source generationの検証・quiesce・commit</text><text class="sub" x="30" y="72">candidateはcurrentと分離して保持し、安全なaction境界と明示的なchoiceなしには切り替えない。</text>
  <g><rect class="actor" x="30" y="92" width="150" height="58"/><text class="label" x="105" y="116">Watcher</text><text class="code" x="105" y="137">browser / CLI</text><rect class="actor" x="225" y="92" width="170" height="58"/><text class="label" x="310" y="116">Source frontend</text><text class="code" x="310" y="137">parse + diagnostics</text><rect class="core" x="440" y="92" width="175" height="58"/><text class="label" x="528" y="116">Live reload</text><text class="code" x="528" y="137">live-reload-session</text><rect class="core" x="660" y="92" width="175" height="58"/><text class="label" x="748" y="116">Current runtime</text><text class="code" x="748" y="137">navigation session</text><rect class="actor" x="880" y="92" width="155" height="58"/><text class="label" x="958" y="116">Planner</text><text class="code" x="958" y="137">reload-plan.js</text><rect class="core" x="1080" y="92" width="165" height="58"/><text class="label" x="1163" y="116">Next session</text><text class="code" x="1163" y="137">candidate runtime</text><rect class="ui" x="1290" y="92" width="90" height="58"/><text class="label" x="1335" y="116">Overlay</text><text class="code" x="1335" y="137">status</text></g>
  <g><path class="life" d="M105 150V855"/><path class="life" d="M310 150V855"/><path class="life" d="M528 150V855"/><path class="life" d="M748 150V855"/><path class="life" d="M958 150V855"/><path class="life" d="M1163 150V855"/><path class="life" d="M1335 150V855"/></g>
  <path class="msg" d="M105 190H302"/><text class="txt" x="204" y="181">stable source generation</text><path class="ret" d="M310 230H113"/><text class="txt" x="212" y="221">frontend result</text>
  <rect class="invalid" x="35" y="260" width="360" height="105" rx="11"/><text class="label dangerText" x="215" y="287">alt: invalid frontend result</text><text class="note" x="55" y="314">candidateを破棄し、diagnosticだけを更新。</text><text class="note" x="55" y="338">current runtimeとcurrent integrityは変えない。</text><path class="msg danger" d="M310 380H1327"/><text class="txt dangerText" x="820" y="371">INVALID + canonical diagnostics</text>
  <path class="msg" d="M310 420H520"/><text class="txt" x="415" y="411">stage(valid StoryDocument, integrity)</text><text class="state" x="550" y="441">quiescing</text><path class="msg" d="M528 460H740"/><text class="txt" x="634" y="451">quiesce(candidateId, action mode)</text><path class="ret" d="M748 505H536"/><text class="txt" x="642" y="496">cleanup-complete immutable token</text>
  <path class="msg" d="M528 545H950"/><text class="txt" x="739" y="536">current execution + candidate + token</text><path class="ret" d="M958 585H536"/><text class="txt" x="747" y="576">storyStart / currentScene / currentAction options</text><path class="msg" d="M528 625H1327"/><text class="txt" x="928" y="616">PENDING: plan + enabled choices</text>
  <rect class="choice" x="405" y="650" width="840" height="95" rx="12"/><text class="label" x="825" y="675">author choice</text><text class="note" x="430" y="701">defer / discard → current.resumeQuiesce(candidateId) → candidate破棄 → active</text><text class="note" x="430" y="726">commit → next sessionを構成してからcurrentをstop + disposeし、選択destinationからnext.start</text>
  <path class="msg" d="M528 775H1155"/><text class="txt" x="842" y="766">makeSession(candidate, previous, preserve presentation)</text><path class="ret" d="M1163 808H536"/><text class="txt" x="850" y="799">new session ready</text><path class="msg" d="M528 840H740"/><text class="txt" x="634" y="831">stop + dispose(live-reload)</text><path class="msg" d="M528 870H1155"/><text class="txt" x="842" y="861">start(destination, variables) → generation + 1</text>
  <rect class="invalid" x="35" y="755" width="345" height="105" rx="11"/><text class="label dangerText" x="208" y="781">alt: quiesce / commit failure</text><text class="note" x="55" y="808">timeout・token不整合はcurrentを停止してfailed。</text><text class="note" x="55" y="833">current停止後のcommit失敗も黙って復旧しない。</text>
</svg>
