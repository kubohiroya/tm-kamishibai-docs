<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">DSL 4.0 rc.5 asset live reloadシーケンス</title><desc id="desc">asset candidateの分類、prepare、activate、adapter accept、commit acknowledgement、旧generation releaseと、rollback・full rebuild分岐。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#315b72"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#172b3a}.title{font-size:29px;font-weight:700}.sub{font-size:15px;fill:#486272}.actor{fill:#eaf4fa;stroke:#397a9c;stroke-width:2;rx:10}.tx{fill:#fff1df;stroke:#b87629;stroke-width:2;rx:10}.label{font-size:16px;font-weight:700;text-anchor:middle}.code{font-family:"SFMono-Regular",Consolas,monospace;font-size:11px;text-anchor:middle;fill:#315b72}.life{stroke:#98aab5;stroke-width:1.5;stroke-dasharray:6 6}.msg{stroke:#315b72;stroke-width:2;fill:none;marker-end:url(#a)}.ret{stroke:#55798d;stroke-width:1.8;stroke-dasharray:6 5;fill:none;marker-end:url(#a)}.txt{font-size:13px;fill:#304a59;text-anchor:middle}.frame{fill:#fff9ef;stroke:#c18b48;stroke-width:1.7}.fail{fill:#fff4f4;stroke:#b64d4d;stroke-width:1.7}.ok{fill:#effaf5;stroke:#3b8b70;stroke-width:1.7}.head{font-size:14px;font-weight:700}.note{font-size:12.5px;fill:#526672}.state{font-family:"SFMono-Regular",Consolas,monospace;font-size:12px;font-weight:700;fill:#8a571e}</style></defs>
  <rect width="1200" height="760" fill="#fff"/><text class="title" x="30" y="44">Asset generationのprepare・activate・release</text><text class="sub" x="30" y="72">acknowledgementを公開してから旧世代を解放する。activation失敗時は旧世代を維持する。</text>
  <g><rect class="actor" x="40" y="95" width="160" height="58"/><text class="label" x="120" y="119">Reload coordinator</text><text class="code" x="120" y="140">candidate revision</text><rect class="tx" x="285" y="95" width="190" height="58"/><text class="label" x="380" y="119">Asset transaction</text><text class="code" x="380" y="140">asset-reload-tx.js</text><rect class="actor" x="560" y="95" width="160" height="58"/><text class="label" x="640" y="119">Provider</text><text class="code" x="640" y="140">prepared generation</text><rect class="actor" x="805" y="95" width="160" height="58"/><text class="label" x="885" y="119">Adapter</text><text class="code" x="885" y="140">accept / discard</text><rect class="actor" x="1050" y="95" width="110" height="58"/><text class="label" x="1105" y="119">Overlay</text><text class="code" x="1105" y="140">events</text></g>
  <g><path class="life" d="M120 153V720"/><path class="life" d="M380 153V720"/><path class="life" d="M640 153V720"/><path class="life" d="M885 153V720"/><path class="life" d="M1105 153V720"/></g>
  <path class="msg" d="M120 195H372"/><text class="txt" x="246" y="186">stage(summary, revision)</text><text class="state" x="405" y="216">preparing</text><path class="msg" d="M380 240H632"/><text class="txt" x="506" y="231">prepareGeneration(provider, signal)</text><path class="ret" d="M640 285H388"/><text class="txt" x="514" y="276">activate / rollback / release</text><path class="msg" d="M380 325H1097"/><text class="txt" x="739" y="316">preview.asset.staged → ready</text>
  <rect class="frame" x="245" y="350" width="730" height="240" rx="12"/><text class="head" x="263" y="376">commit(revision)</text><path class="msg" d="M380 410H632"/><text class="txt" x="506" y="401">prepared.activate(request)</text><path class="ret" d="M640 450H388"/><text class="txt" x="514" y="441">activation acknowledgement</text><path class="msg" d="M380 490H877"/><text class="txt" x="629" y="481">adapter.accept(revision)</text><path class="ret" d="M885 525H388"/><text class="txt" x="637" y="516">accepted</text><path class="msg" d="M380 560H1097"/><text class="txt" x="739" y="551">preview.asset.committed / generation + 1</text><text class="state" x="405" y="580">active</text>
  <rect class="ok" x="780" y="605" width="370" height="92" rx="11"/><text class="head" x="800" y="632">ack公開後</text><text class="note" x="800" y="658">previous.release(generation-replaced-after-ack)</text><text class="note" x="800" y="681">release失敗はdiagnostic化し、再試行集合へ保持</text><path class="msg" d="M380 650H632"/><text class="txt" x="506" y="641">previous.release</text>
  <rect class="fail" x="35" y="605" width="665" height="105" rx="11"/><text class="head" x="55" y="632">alt: activation failure / full rebuild</text><text class="note" x="55" y="657">activate失敗 → candidate.rollback → candidate.release → adapter.discard。旧世代はactiveのまま。</text><text class="note" x="55" y="681">新規file-backed ID削除などはfull-rebuildへ分類し、prepareせずdiagnosticを表示。</text>
</svg>
