<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">DSL 4.0 rc.5 source buildシーケンス</title>
  <desc id="desc">CLIからSource Graph、frontend、validator、StoryDocument、builderへ進み、検証済みSB3を生成する流れと、診断時に副作用なく停止する分岐。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#315b72"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#172b3a}.title{font-size:29px;font-weight:700}.sub{font-size:15px;fill:#486272}.actor{fill:#eef6fb;stroke:#397b9d;stroke-width:2;rx:10}.actor2{fill:#e9f7f2;stroke:#31806f;stroke-width:2;rx:10}.label{font-size:16px;font-weight:700;text-anchor:middle}.code{font-family:"SFMono-Regular",Consolas,monospace;font-size:12px;text-anchor:middle;fill:#315b72}.life{stroke:#9aabb5;stroke-width:1.5;stroke-dasharray:6 6}.msg{stroke:#315b72;stroke-width:2;fill:none;marker-end:url(#a)}.ret{stroke:#54788d;stroke-width:1.8;stroke-dasharray:6 5;fill:none;marker-end:url(#a)}.txt{font-size:14px;fill:#304a59;text-anchor:middle}.step{fill:#315b72}.stepText{fill:#fff;font-size:12px;font-weight:700;text-anchor:middle}.alt{fill:#fff4f4;stroke:#b84f4f;stroke-width:2}.ok{fill:#f0fbf6;stroke:#3f8d72;stroke-width:2}.note{font-size:13px;fill:#5b6570}.danger{stroke:#b84f4f;marker-end:url(#a)}.dangerText{fill:#9c3535}</style></defs>
  <rect width="1400" height="820" fill="#fff"/><text class="title" x="35" y="45">Sourceから検証済み成果物まで</text><text class="sub" x="35" y="73">固定実装 f323a54：各gateを通過したデータだけが次の層へ渡る。</text>
  <g><rect class="actor" x="35" y="95" width="155" height="58"/><text class="label" x="113" y="119">Author / CLI</text><text class="code" x="113" y="140">build-dsl4</text><rect class="actor" x="230" y="95" width="165" height="58"/><text class="label" x="313" y="119">Source Graph</text><text class="code" x="313" y="140">source-graph.js</text><rect class="actor" x="435" y="95" width="170" height="58"/><text class="label" x="520" y="119">Graph frontend</text><text class="code" x="520" y="140">graph-frontend.js</text><rect class="actor" x="645" y="95" width="170" height="58"/><text class="label" x="730" y="119">Source frontend</text><text class="code" x="730" y="140">source-frontend.js</text><rect class="actor" x="855" y="95" width="170" height="58"/><text class="label" x="940" y="119">Validators</text><text class="code" x="940" y="140">Schema / semantic</text><rect class="actor2" x="1065" y="95" width="145" height="58"/><text class="label" x="1138" y="119">Immutable IR</text><text class="code" x="1138" y="140">StoryDocument</text><rect class="actor2" x="1250" y="95" width="125" height="58"/><text class="label" x="1313" y="119">Builder</text><text class="code" x="1313" y="140">SB3</text></g>
  <g><path class="life" d="M113 153V780"/><path class="life" d="M313 153V780"/><path class="life" d="M520 153V780"/><path class="life" d="M730 153V780"/><path class="life" d="M940 153V780"/><path class="life" d="M1138 153V780"/><path class="life" d="M1313 153V780"/></g>
  <circle class="step" cx="55" cy="190" r="13"/><text class="stepText" x="55" y="194">1</text><path class="msg" d="M113 190H305"/><text class="txt" x="209" y="181">entry source + explicit limits</text>
  <circle class="step" cx="255" cy="245" r="13"/><text class="stepText" x="255" y="249">2</text><path class="msg" d="M313 245H512"/><text class="txt" x="412" y="236">bounded include graph + source origins</text>
  <circle class="step" cx="462" cy="300" r="13"/><text class="stepText" x="462" y="304">3</text><path class="msg" d="M520 300H722"/><text class="txt" x="621" y="291">compose declarations; preserve locations</text>
  <circle class="step" cx="672" cy="355" r="13"/><text class="stepText" x="672" y="359">4</text><path class="msg" d="M730 355H932"/><text class="txt" x="831" y="346">restricted YAML + resource limits</text>
  <path class="ret" d="M940 410H738"/><text class="txt" x="839" y="401">Schema → semantic → expression result</text>
  <rect class="alt" x="640" y="438" width="385" height="90" rx="12"/><text class="label dangerText" x="833" y="466">alt: invalid</text><text class="note" x="662" y="490">canonical diagnosticsを返し、StoryDocumentを作らない。</text><text class="note" x="662" y="512">file出力・runtime切替・asset commitは行わない。</text><path class="msg danger" d="M730 535H121"/><text class="txt dangerText" x="425" y="552">non-zero exit + source位置付きdiagnostic</text>
  <circle class="step" cx="1000" cy="585" r="13"/><text class="stepText" x="1000" y="589">5</text><path class="msg" d="M730 585H1130"/><text class="txt" x="930" y="576">createStoryDocument(normalized source)</text>
  <path class="ret" d="M1138 630H738"/><text class="txt" x="938" y="621">deep-frozen StoryDocument + sourceOrigins</text>
  <circle class="step" cx="1195" cy="680" r="13"/><text class="stepText" x="1195" y="684">6</text><path class="msg" d="M1138 680H1305"/><text class="txt" x="1222" y="671">source + reachable assets</text>
  <rect class="ok" x="1000" y="710" width="365" height="76" rx="12"/><text class="label" x="1183" y="737">embed → reload → revalidate</text><text class="note" x="1183" y="758" text-anchor="middle">componentとasset bundleを再読込し、</text><text class="note" x="1183" y="777" text-anchor="middle">再検証できたbyteだけを公開</text>
</svg>
