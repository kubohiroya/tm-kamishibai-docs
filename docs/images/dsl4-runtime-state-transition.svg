<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">DSL 4.0 rc.5 runtime状態遷移</title><desc id="desc">一つのRuntimeControllerが現在の一世代をどう再生しているかを表す。idleからrunningへ開始し、paused、finished、failed、stoppedへ遷移するRuntimeStatusと、restart、resume、quiesce、stop、failureの関係。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315b72"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad4545"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#172b3a}.title{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#486272}.scope{font-size:15px;font-weight:700;fill:#1f6f60}.state{stroke-width:3}.idle{fill:#eef3f6;stroke:#708491}.run{fill:#e4f6ef;stroke:#25826e}.pause{fill:#f1eafa;stroke:#7454a4}.done{fill:#eaf2fb;stroke:#3f78a3}.fail{fill:#fff0f0;stroke:#b44848}.stop{fill:#fff4e5;stroke:#b8792d}.name{font-family:"SFMono-Regular",Consolas,monospace;font-size:22px;font-weight:700;text-anchor:middle}.detail{font-size:14px;text-anchor:middle;fill:#49606f}.edge{fill:none;stroke:#315b72;stroke-width:2.2;marker-end:url(#a)}.danger{stroke:#ad4545;marker-end:url(#r)}.dash{stroke-dasharray:7 6}.edgeText{font-size:14px;fill:#315b72;text-anchor:middle}.dangerText{fill:#9c3535}.event{font-family:"SFMono-Regular",Consolas,monospace;font-size:12px;fill:#536875}.note{fill:#f7fafc;stroke:#b9c7d0;stroke-width:1.7}.noteTitle{font-size:15px;font-weight:700}.noteText{font-size:13px;fill:#415866}</style></defs>
  <rect width="1200" height="760" fill="#fff"/><text class="title" x="35" y="48">RuntimeStatusの状態遷移</text><text class="sub" x="35" y="76">`runtime-controller.js`の公開snapshotとeventを基準にした遷移。action中断時はgeneration guardが遅延完了を無効化する。</text><text class="scope" x="35" y="103">状態の主体：1個のRuntimeController ─ 現在の1 generationをどう再生しているか</text>
  <g><rect class="state idle" x="65" y="300" width="170" height="95" rx="47"/><text class="name" x="150" y="340">idle</text><text class="detail" x="150" y="366">初期状態</text><rect class="state run" x="430" y="285" width="220" height="125" rx="62"/><text class="name" x="540" y="335">running</text><text class="detail" x="540" y="363">scene / actionをdispatch</text><text class="event" x="540" y="386" text-anchor="middle">runtime.start / resume</text><rect class="state pause" x="825" y="120" width="220" height="110" rx="55"/><text class="name" x="935" y="166">paused</text><text class="detail" x="935" y="192">再開可能なaction境界</text><text class="event" x="935" y="213" text-anchor="middle">runtime.quiesce</text><rect class="state done" x="840" y="310" width="190" height="95" rx="47"/><text class="name" x="935" y="350">finished</text><text class="detail" x="935" y="376">全action完了</text><rect class="state fail" x="825" y="490" width="220" height="105" rx="52"/><text class="name" x="935" y="532">failed</text><text class="detail" x="935" y="558">fail-closed + diagnostic</text><text class="event" x="935" y="579" text-anchor="middle">runtime.fail</text><rect class="state stop" x="430" y="560" width="220" height="105" rx="52"/><text class="name" x="540" y="602">stopped</text><text class="detail" x="540" y="628">明示停止・asset解放</text><text class="event" x="540" y="649" text-anchor="middle">runtime.stop</text></g>
  <path class="edge" d="M235 347H424"/><text class="edgeText" x="330" y="334">start()</text>
  <path class="edge" d="M650 312C735 245 785 195 819 181"/><text class="edgeText" x="730" y="239">reposition() / quiesce境界</text>
  <path class="edge" d="M825 211C760 254 713 289 656 325"/><text class="edgeText" x="732" y="298">resume() / resumeQuiesce()</text>
  <path class="edge" d="M650 352H834"/><text class="edgeText" x="744" y="340">最後のaction.commit</text>
  <path class="edge danger" d="M635 410C720 467 765 514 819 535"/><text class="edgeText dangerText" x="720" y="478">action / port / asset failure</text>
  <path class="edge" d="M500 410C470 468 460 510 490 554"/><text class="edgeText" x="438" y="490">stop()</text>
  <path class="edge" d="M935 310V236"/><text class="edgeText" x="1001" y="273">reposition()</text>
  <path class="edge dash" d="M825 550C730 520 700 450 646 397"/><text class="edgeText" x="716" y="498">start() / restart</text>
  <path class="edge dash" d="M650 596C720 548 700 445 642 400"/><text class="edgeText" x="682" y="540">start()</text>
  <rect class="note" x="50" y="500" width="300" height="165" rx="14"/><text class="noteTitle" x="72" y="530">中断と整合性</text><text class="noteText" x="72" y="558">• navigation / stop / quiesceでactive actionをabort</text><text class="noteText" x="72" y="584">• generationを進め、古い非同期完了を無視</text><text class="noteText" x="72" y="610">• action.cancel後にcleanupを待って安全境界を公開</text><text class="noteText" x="72" y="636">• timeoutはK4-RELOAD-QUIESCE-TIMEOUTでfail</text>
</svg>
