<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 820" role="img" aria-labelledby="title desc">
  <title id="title">DSL 4.0 rc.5 live reload状態遷移</title><desc id="desc">一つのLiveReloadSessionがcurrent runtimeとcandidateの更新をどう調停しているかを表す。waiting、active、invalid、quiescing、pending、failed、disposedの状態とstage、quiesce、defer、commit、disposeの遷移。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315b72"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#aa4545"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#172b3a}.title{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#486272}.scope{font-size:15px;font-weight:700;fill:#5b3f8c}.state{stroke-width:2.8}.wait{fill:#eef3f6;stroke:#708491}.active{fill:#e5f6ef;stroke:#25826e}.work{fill:#eef2fb;stroke:#4d6fa1}.pending{fill:#f1eafa;stroke:#7454a4}.invalid{fill:#fff4e8;stroke:#b8792d}.failed{fill:#fff0f0;stroke:#b44848}.disposed{fill:#f2f2f2;stroke:#707070}.name{font-family:"SFMono-Regular",Consolas,monospace;font-size:20px;font-weight:700;text-anchor:middle}.detail{font-size:13px;text-anchor:middle;fill:#49606f}.edge{fill:none;stroke:#315b72;stroke-width:2.1;marker-end:url(#a)}.danger{stroke:#aa4545;marker-end:url(#r)}.dash{stroke-dasharray:7 6}.edgeText{font-size:13px;fill:#315b72;text-anchor:middle}.dangerText{fill:#963737}.note{fill:#f8fafb;stroke:#bdc9d0;stroke-width:1.7}.noteHead{font-size:15px;font-weight:700}.noteText{font-size:13px;fill:#445a67}</style></defs>
  <rect width="1300" height="820" fill="#fff"/><text class="title" x="35" y="48">LiveReloadSessionの状態遷移</text><text class="sub" x="35" y="76">invalid candidateはcurrent runtimeを維持する。安全境界へ到達したcandidateだけがpendingとcommitへ進む。</text><text class="scope" x="35" y="103">状態の主体：1個のLiveReloadSession ─ current runtimeとcandidateの更新をどう調停しているか</text>
  <rect class="state wait" x="55" y="310" width="180" height="90" rx="45"/><text class="name" x="145" y="348">waiting</text><text class="detail" x="145" y="373">currentなし</text>
  <rect class="state active" x="335" y="295" width="210" height="120" rx="60"/><text class="name" x="440" y="338">active</text><text class="detail" x="440" y="363">current sessionを保持</text><text class="detail" x="440" y="385">candidateなし</text>
  <rect class="state invalid" x="335" y="545" width="210" height="105" rx="52"/><text class="name" x="440" y="587">invalid</text><text class="detail" x="440" y="612">diagnosticを表示</text><text class="detail" x="440" y="633">currentは維持</text>
  <rect class="state work" x="690" y="135" width="220" height="105" rx="52"/><text class="name" x="800" y="177">quiescing</text><text class="detail" x="800" y="202">cleanup完了を待機</text><text class="detail" x="800" y="222">token未確定</text>
  <rect class="state pending" x="1000" y="295" width="220" height="120" rx="60"/><text class="name" x="1110" y="338">pending</text><text class="detail" x="1110" y="363">token + reload plan</text><text class="detail" x="1110" y="385">author choice待ち</text>
  <rect class="state failed" x="715" y="545" width="210" height="105" rx="52"/><text class="name" x="820" y="587">failed</text><text class="detail" x="820" y="612">fail-closed</text><text class="detail" x="820" y="633">reload diagnostic</text>
  <rect class="state disposed" x="1020" y="650" width="190" height="90" rx="45"/><text class="name" x="1115" y="688">disposed</text><text class="detail" x="1115" y="713">全sessionを解放</text>
  <path class="edge" d="M235 355H329"/><text class="edgeText" x="282" y="342">valid初回stage → start</text>
  <path class="edge" d="M545 322C605 245 640 207 684 194"/><text class="edgeText" x="611" y="250">valid candidate stage</text>
  <path class="edge" d="M910 188C965 215 1015 257 1050 289"/><text class="edgeText" x="1000" y="214">quiesce token + plan</text>
  <path class="edge" d="M1040 415C930 480 655 480 520 408"/><text class="edgeText" x="790" y="467">defer / discard → resumeQuiesce</text>
  <path class="edge" d="M1000 347C835 348 710 350 551 352"/><text class="edgeText" x="776" y="337">commit → next session start / generation + 1</text>
  <path class="edge" d="M440 415V539"/><text class="edgeText" x="505" y="483">invalid stage</text>
  <path class="edge" d="M335 598C270 570 260 455 345 408"/><text class="edgeText" x="243" y="512">次のvalid stage</text>
  <path class="edge danger" d="M760 240C735 345 754 467 793 539"/><text class="edgeText dangerText" x="701" y="405">timeout / invalid token</text>
  <path class="edge danger" d="M1003 404C940 470 895 510 860 540"/><text class="edgeText dangerText" x="950" y="493">current停止後のcommit失敗</text>
  <path class="edge dash" d="M545 385C720 485 950 584 1069 645"/><text class="edgeText" x="801" y="556">dispose()（どの状態からも可能）</text>
  <rect class="note" x="45" y="690" width="600" height="92" rx="13"/><text class="noteHead" x="65" y="719">状態と実行継続は同義ではない</text><text class="noteText" x="65" y="746">`invalid`ではreload stateだけが診断状態になり、current runtimeとcurrent integrityは変わらない。</text><text class="noteText" x="65" y="769">`failed`はquiesce安全性を保証できないため、current runtimeを停止するfail-closed境界。</text>
</svg>
